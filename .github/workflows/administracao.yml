name: Administração (prod)

# Execução manual: GitHub → Actions → "Administração (prod)" → Run workflow.
# Roda scripts/set-role.ts e scripts/seed-matriz.ts no projeto prod (siap-seds-01)
# com a chave do Admin SDK guardada no secret FIREBASE_SERVICE_ACCOUNT_ADMIN_PROD.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer'
        type: choice
        options: [definir-perfil, remover-perfil, publicar-matriz]
        required: true
      email:
        description: 'E-mail do usuário (para definir ou remover perfil)'
        type: string
        required: false
      perfil:
        description: 'Perfil (para definir perfil)'
        type: choice
        options: [membro, relator, presidente, controle, admin]
        required: false
      forcar:
        description: 'Publicar matriz: sobrescrever se já existir'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: administracao-prod
  cancel-in-progress: false

jobs:
  executar:
    name: ${{ inputs.acao }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Executar ${{ inputs.acao }}
        # Entradas passadas por variáveis de ambiente (nunca interpoladas no script) para evitar injeção de comandos.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADMIN_PROD }}
          ACAO: ${{ inputs.acao }}
          EMAIL: ${{ inputs.email }}
          PERFIL: ${{ inputs.perfil }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Secret ausente::Cadastre FIREBASE_SERVICE_ACCOUNT_ADMIN_PROD (veja o README, seção 4)."
            exit 1
          fi
          case "$ACAO" in
            definir-perfil)
              if [ -z "$EMAIL" ]; then echo "::error::Informe o e-mail."; exit 1; fi
              npm run set-role -- --projeto prod --email "$EMAIL" --perfil "$PERFIL" --confirmar
              ;;
            remover-perfil)
              if [ -z "$EMAIL" ]; then echo "::error::Informe o e-mail."; exit 1; fi
              npm run set-role -- --projeto prod --email "$EMAIL" --remover --confirmar
              ;;
            publicar-matriz)
              argumentos=(--projeto prod --confirmar)
              if [ "$FORCAR" = "true" ]; then argumentos+=(--forcar); fi
              npm run seed:matriz -- "${argumentos[@]}"
              ;;
          esac
